[project]
name = "post-agent"
version = "0.1.0"
description = "Telegram bot for scheduled self-development posts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0,<2.0",
  "python-telegram-bot[job-queue]>=22.0,<23.0"
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bot"]
